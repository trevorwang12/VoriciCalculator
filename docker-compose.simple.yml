version: '3.8'

services:
  vorici-calculator:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vorici-calculator
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=UTC
    networks:
      - vorici-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  vorici-network:
    driver: bridge

volumes:
  nginx-logs:
    driver: local