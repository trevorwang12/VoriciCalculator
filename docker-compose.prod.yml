services:
  vorici-calculator:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: vorici-calculator
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=UTC
      - NODE_ENV=production
    networks:
      - vorici-network
    volumes:
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true

networks:
  vorici-network:
    driver: bridge

volumes:
  nginx-logs:
    driver: local